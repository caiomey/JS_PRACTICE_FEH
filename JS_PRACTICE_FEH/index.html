<!DOCTYPE html>
<html>
<head>
    <title>Functions and Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 
</head>
<body>

    <div class="container">
        <details ontoggle="message()">
            <summary>Instruction</summary>
            <i> Enter the two numbers then find its answer </i>        
        </details>
    </div>

    <br>

    <form>
        <label> Enter the 1st number:</label>
        <input type="number" id="num1" placeholder="type here...">
    <br>
        <label> Enter the 2nd number:</label>
        <input type="number" id="num2" placeholder="type here...">
    <br><br>

        <div class="button">
            <button type="button" onmouseover="plus()"> CALCULATE </button>
             <button type="button" onmouseover="minus()"> CALCULATE </button>
            <span style="text-align: center;"> <h1 id="result"> </h1></span>
        </div>
    </form>

    <script>
        function message() {
            alert("Try It");
        }

        function plus() {
            var add1 = document.getElementById("num1").value;
            var add2 = document.getElementById("num2").value;
            var sum = Number(add1) + Number(add2);

        document.getElementById('result').innerHTML = 'Answer is ' + sum;            
        }

        function minus() {
            var minus1 = document.getElementById("num1").value;
            var minus2 = document.getElementById("num2").value;
            var ans = Number(minus1) + Number(minus2);
 document.getElementById('result').innerHTML = 'Answer is ' + ans;            
        }



    </script>








</body>
</html>
